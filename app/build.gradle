plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // renders screens to PNG on the build machine (no phone needed) so the UI can be reviewed in CI
    id 'app.cash.paparazzi'
}
android {
    namespace 'app.grab.pill'
    compileSdk 34
    defaultConfig {
        applicationId 'app.grab.pill'
        minSdk 29
        targetSdk 34
        versionCode 4
        versionName '0.4'
        // every phone from the last ~8 years is 64-bit ARM; dropping the other CPU types saves ~40 MB
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging {
        resources { excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'] }
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // QR scanning without camera permission (Google code scanner)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // On-device: read QR codes + text (show time, seat, station) from ticket screenshots/PDFs
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Re-draw a crisp, scanner-friendly QR from the decoded payload
    implementation 'com.google.zxing:core:3.5.3'
    // Scan & pay: live camera + amount on the same screen
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    // Context: low-power geofences (metro stations, home, work)
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    // Optional AI key is kept encrypted on the phone
    implementation 'androidx.security:security-crypto:1.0.0'
    // Optional: Claude reads ambiguous messages ("can you mail me the signed copy?"). Off by default.
    implementation 'com.anthropic:anthropic-java:3.3.0'
    testImplementation 'junit:junit:4.13.2'
}
